<!doctype html><meta charset=utf-8><style>
body{margin:0;width:540px;height:960px;background:#F3F4F8;font-family:"WenQuanYi Zen Hei",sans-serif;color:#1c2233;overflow:hidden}
.bar{height:96px;background:#fff;display:flex;align-items:center;padding:0 28px;font-size:34px;font-weight:700;border-bottom:2px solid #dde1ec}
.banner{margin:28px 24px 0;background:#FDE8E4;border:3px solid #E5533A;border-radius:18px;padding:22px 24px}
.banner b{display:block;font-size:34px;color:#B3321C;margin-bottom:8px}
.banner span{font-size:27px;line-height:1.5;color:#3a2420}
.card{margin:24px 24px 0;background:#fff;border-radius:18px;padding:6px 24px}
.row{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-size:29px;border-bottom:1px solid #e6e9f2}
.row:last-child{border:0}.on{background:#2E9E6B;color:#fff;border-radius:20px;padding:4px 20px;font-size:25px}
.sub{font-size:23px;color:#6b7390}
.btns{margin:32px 24px 0;display:flex;gap:16px}.btn{flex:1;text-align:center;padding:22px 0;border-radius:18px;font-size:29px;font-weight:700}
.b1{background:#5566F0;color:#fff}.b2{background:#fff;border:3px solid #5566F0;color:#5566F0}
.foot{position:absolute;bottom:16px;width:100%;text-align:center;font-size:21px;color:#8a90a8}
</style>
<div class=bar>〈 資料同步</div>
<div class=banner><b>同步失敗（錯誤碼 E-507）</b><span>裝置儲存空間不足。目前剩餘 0.3 GB，需要至少 1 GB 才能繼續同步。</span></div>
<div class=card>
<div class=row><span>僅在 Wi-Fi 下同步</span><span class=on>開</span></div>
<div class=row><span>自動備份相片</span><span class=on>開</span></div>
<div class=row><span>上次成功同步</span><span class=sub>11 月 9 日</span></div>
</div>
<div class=btns><div class="btn b2">管理儲存空間</div><div class="btn b1">重試</div></div>
