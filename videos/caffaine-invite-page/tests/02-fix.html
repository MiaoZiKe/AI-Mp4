<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小美的生日派對邀請函</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: #ff6b81;
            color: white;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .content {
            padding: 24px;
        }

        .countdown-box {
            background: #fff0f3;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px dashed #ffb3c1;
        }

        .countdown-title {
            font-size: 13px;
            color: #d63384;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .countdown-timer {
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .info-item {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 2px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #222;
            font-size: 15px;
        }

        .rsvp-section {
            margin-top: 20px;
        }

        .rsvp-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
            color: #333;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            color: white;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-yes { background-color: #2ed573; }
        .btn-maybe { background-color: #ffa502; }
        .btn-no { background-color: #ff4757; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 16px;
            font-size: 18px;
            color: #333;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }

        .modal-btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .guest-list {
            margin-top: 24px;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }

        .guest-list h4 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .guest-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .tag {
            background: #f1f2f6;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #333;
        }

        .tag-yes { background: #e7f9ed; color: #2ed573; }
        .tag-maybe { background: #fffdf0; color: #ffa502; }
        .tag-no { background: #ffeeef; color: #ff4757; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎉 小美生日派對</h1>
            <p>邀請你一起來慶祝！</p>
        </div>

        <div class="content">
            <div class="countdown-box">
                <div class="countdown-title">距離派對還有</div>
                <div class="countdown-timer" id="countdown">計算中...</div>
            </div>

            <div class="info-card">
                <div class="info-item">
                    <span class="info-label">時間</span>
                    <span class="info-value">12 月 19 日（週六）下午 6 點</span>
                </div>
                <div class="info-item" style="margin-top: 12px;">
                    <span class="info-label">地點</span>
                    <span class="info-value">示範小館<br><small style="color:#666;">台北市示範路 1 號</small></span>
                </div>
            </div>

            <div class="rsvp-section">
                <div class="rsvp-title">你會來參加嗎？</div>
                <div class="btn-group">
                    <button class="btn btn-yes" onclick="openModal('我會去')">✨ 我會去</button>
                    <button class="btn btn-maybe" onclick="openModal('可能去')">🤔 可能去</button>
                    <button class="btn btn-no" onclick="openModal('去不了')">😢 去不了</button>
                </div>
            </div>

            <div class="guest-list">
                <h4>已回覆的名單 (<span id="guest-count">0</span>)</h4>
                <div class="guest-tags" id="guest-tags">
                    <span style="font-size: 12px; color: #999;">還沒有人回覆，快來搶頭香！</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="rsvpModal">
        <div class="modal-content">
            <h3 id="modal-title">填寫您的名字</h3>
            <input type="text" id="guest-name" class="modal-input" placeholder="請輸入你的名字">
            <button class="modal-btn" onclick="submitRsvp()">送出回覆</button>
        </div>
    </div>

    <script>
        // 倒數計時
        function updateCountdown() {
            // 設定目標時間：當年度的 12 月 19 日 下午 6 點 (18:00)
            const now = new Date();
            let year = now.getFullYear();
            let targetDate = new Date(year, 11, 19, 18, 0, 0); // 11 代表 12月

            // 如果今年已經過了，就計算明年的
            if (now > targetDate) {
                targetDate = new Date(year + 1, 11, 19, 18, 0, 0);
            }

            const diff = targetDate - now;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerText = 
                `${days} 天 ${hours} 小時 ${minutes} 分 ${seconds} 秒`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 簡易回覆功能 (使用 localStorage 儲存)
        let selectedStatus = '';
        let guests = JSON.parse(localStorage.getItem('party_guests')) || [];

        function openModal(status) {
            selectedStatus = status;
            document.getElementById('modal-title').innerText = `你選擇了「${status}」`;
            document.getElementById('guest-name').value = '';
            document.getElementById('rsvpModal').style.display = 'flex';
        }

        function submitRsvp() {
            const nameInput = document.getElementById('guest-name');
            const name = nameInput.value.trim();

            if (!name) {
                alert('請輸入名字！');
                return;
            }

            guests.push({ name: name, status: selectedStatus });
            localStorage.setItem('party_guests', JSON.stringify(guests));
            document.getElementById('rsvpModal').style.display = 'none';
            renderGuests();
        }

        function renderGuests() {
            const container = document.getElementById('guest-tags');
            const countSpan = document.getElementById('guest-count');
            
            countSpan.innerText = guests.length;

            if (guests.length === 0) {
                container.innerHTML = '<span style="font-size: 12px; color: #999;">還沒有人回覆，快來搶頭香！</span>';
                return;
            }

            container.innerHTML = '';
            guests.forEach(guest => {
                const tag = document.createElement('span');
                tag.className = 'tag ';
                if (guest.status === '我會去') tag.classList.add('tag-yes');
                else if (guest.status === '可能去') tag.classList.add('tag-maybe');
                else tag.classList.add('tag-no');

                tag.innerText = `${guest.name} (${guest.status})`
                container.appendChild(tag);
            });
        }

        // 初始化渲染名單
        renderGuests();

        // 點擊 Modal 以外區域關閉
        window.onclick = function(event) {
            const modal = document.getElementById('rsvpModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
