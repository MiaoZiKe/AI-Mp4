<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小美的生日派對邀請函</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: #ff6b81;
            color: white;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .content {
            padding: 24px 20px;
        }

        .countdown-box {
            background: #fff0f3;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 24px;
            border: 2px dashed #ffb3c1;
        }

        .countdown-title {
            font-size: 13px;
            color: #ff4757;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .countdown-timer {
            font-size: 20px;
            font-weight: bold;
            color: #2f3542;
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .info-item {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: bold;
            color: #ff6b81;
            display: block;
            margin-bottom: 2px;
        }

        .rsvp-section {
            text-align: center;
        }

        .rsvp-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2f3542;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-yes { background: #2ed573; color: white; }
        .btn-maybe { background: #ffa502; color: white; }
        .btn-no { background: #ff4757; color: white; }

        .form-container {
            display: none;
            background: #f1f2f6;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced6e0;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-container button {
            width: 100%;
            padding: 10px;
            background: #57606f;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .guest-list {
            border-top: 1px solid #eee;
            padding-top: 16px;
            text-align: left;
        }

        .guest-list h3 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #2f3542;
        }

        .guest-items {
            max-height: 150px;
            overflow-y: auto;
            font-size: 13px;
        }

        .guest-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
        }
        .tag-yes { background: #2ed573; }
        .tag-maybe { background: #ffa502; }
        .tag-no { background: #ff4757; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎉 小美生日派對 🎉</h1>
            <p>誠摯邀請你來一起慶祝！</p>
        </div>

        <div class="content">
            <div class="countdown-box">
                <div class="countdown-title">距離派對還有</div>
                <div class="countdown-timer" id="countdown">計算中...</div>
            </div>

            <div class="info-card">
                <div class="info-item">
                    <span class="info-label">📅 日期與時間</span>
                    12 月 20 日（週六）下午 6 點
                </div>
                <div class="info-item">
                    <span class="info-label">📍 地點</span>
                    示範小館（台北市示範路 1 號）
                </div>
            </div>

            <div class="rsvp-section">
                <div class="rsvp-title">你會來參加嗎？</div>
                
                <div class="btn-group" id="btnGroup">
                    <button class="btn btn-yes" onclick="selectStatus('我會去')">✨ 我會去</button>
                    <button class="btn btn-maybe" onclick="selectStatus('可能去')">🤔 可能去</button>
                    <button class="btn btn-no" onclick="selectStatus('去不了')">😢 去不了</button>
                </div>

                <div class="form-container" id="formContainer">
                    <div id="selectedStatusText" style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #ff6b81;"></div>
                    <input type="text" id="guestName" placeholder="請輸入你的名字" maxlength="15">
                    <button onclick="submitRsvp()">送出回覆</button>
                </div>

                <div class="guest-list">
                    <h3>已回覆名單 (<span id="guestCount">0</span>)</h3>
                    <div class="guest-items" id="guestItems">
                        <div style="color: #a4b0be; text-align: center; padding: 10px;">還沒有人回覆，快來搶頭香！</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 倒數計時
        function updateCountdown() {
            const partyDate = new Date('2024-12-20T18:00:00');
            const now = new Date();
            const diff = partyDate - now;

            const countdownEl = document.getElementById('countdown');

            if (diff <= 0) {
                countdownEl.innerText = '派對已經開始囉！';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            countdownEl.innerText = `${days} 天 ${hours} 小時 ${minutes} 分`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // RSVP 互動邏輯
        let currentStatus = '';
        let guests = [
            { name: '小安', status: '我會去' },
            { name: '阿傑', status: '可能去' }
        ];

        function selectStatus(status) {
            currentStatus = status;
            document.getElementById('selectedStatusText').innerText = `你選擇的狀態：${status}`;
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('guestName').focus();
        }

        function submitRsvp() {
            const nameInput = document.getElementById('guestName');
            const name = nameInput.value.trim();

            if (!name) {
                alert('請輸入名字喔！');
                return;
            }

            guests.unshift({ name: name, status: currentStatus });
            nameInput.value = '';
            document.getElementById('formContainer').style.display = 'none';
            
            renderGuests();
        }

        function renderGuests() {
            const container = document.getElementById('guestItems');
            const countContainer = document.getElementById('guestCount');
            
            countContainer.innerText = guests.length;

            if (guests.length === 0) {
                container.innerHTML = '<div style="color: #a4b0be; text-align: center; padding: 10px;">還沒有人回覆，快來搶頭香！</div>';
                return;
            }

            container.innerHTML = '';
            guests.forEach(g => {
                let tagClass = 'tag-yes';
                if (g.status === '可能去') tagClass = 'tag-maybe';
                if (g.status === '去不了') tagClass = 'tag-no';

                const item = document.createElement('div');
                item.className = 'guest-item';
                item.innerHTML = `
                    <span>${escapeHtml(g.name)}</span>
                    <span class="tag ${tagClass}">${g.status}</span>
                `;
                container.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 初始化渲染預設名單
        renderGuests();
    </script>
</body>
</html>
